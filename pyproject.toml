[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-npp-opsd"
version = "0.1.0"
description = "Neural posterior primitives for candidate-based inference."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.scripts]
brain-npp = "brain_npp.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
