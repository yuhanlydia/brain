[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-npp-opsd"
version = "0.1.0"
description = "Neural posterior primitives for candidate-based inference."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.scripts]
brain-npp = "brain_npp.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
vindex = [
    "transformers==4.45.2",
    "peft==0.13.2",
    "accelerate==1.0.1",
    "bitsandbytes==0.50.2",
    "Pillow==12.2.0",
    "sentencepiece==0.2.2",
    "protobuf==7.36.1",
    "einops==0.8.2",
    "einops-exts==0.0.4",
    "torchvision==0.28.0",
]
data = ["h5py==3.16.0", "pyarrow==25.0.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
